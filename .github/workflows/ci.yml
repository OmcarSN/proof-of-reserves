name: CI

# Proves the whole project stays honest on every push and PR:
#   • the Compact contract logic passes its zero-knowledge attestation tests
#   • the frontend type-checks and bundles for the browser
# Both jobs run from a clean install, exactly as a fresh clone would.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the badge reflects the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract logic & ZK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The web app imports ../src/reserves.ts, whose bare @midnight-ntwrk/*
      # imports resolve against the ROOT node_modules — so the browser build
      # needs the root deps installed too, not just web/ deps.
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Build (bundles ZK assets from ../managed)
        run: npm run build
        working-directory: web
